[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "afdep"
version = "0.1.0.dev0"
description = "Directional GPU communication for Attention-FFN Disaggregation"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = [
    "LICENSE",
    "NOTICE",
    "THIRD_PARTY_NOTICES.md",
    "afdep/third_party/deepep/LICENSE",
]
authors = [{ name = "AFDEP contributors" }]
dependencies = ["torch>=2.6", "ninja>=1.11", "setuptools>=77", "packaging>=23"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/ms-llmd/AFDEP"
Repository = "https://github.com/ms-llmd/AFDEP"
Issues = "https://github.com/ms-llmd/AFDEP/issues"

[tool.setuptools.packages.find]
include = ["afdep*"]

[tool.setuptools.package-data]
afdep = ["py.typed", "csrc/*", "third_party/deepep/*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
