<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="790" viewBox="0 0 1280 790" role="img" aria-labelledby="title description">
<title id="title">DeepEP standard expert parallelism and afdEP disaggregated communication</title>
<desc id="description">Standard expert parallelism has ranks that both originate tokens and own experts. Selected token routes are dispatched to expert owners and combined results return. afdEP gives separate Attention source ranks and FFN worker ranks explicit request and reply roles. DeepEP masking already produces directional useful payload for AFD, but reuses the general EP protocol. This is a conceptual role diagram, not a claim of arbitrary currently supported topology or dense all-pair payload.</desc>
<defs>
<marker id="dispatch" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 z" fill="#2563eb"/></marker>
<marker id="reply" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 z" fill="#047857"/></marker>
</defs>
