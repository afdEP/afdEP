<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="530" viewBox="0 0 1120 530" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">FastAFD's DeepEP M2N and afdEP-comm</title>
<desc id="desc">FastAFD's DeepEP M2N runs DeepEP V2 over one symmetric group: every rank sends and receives, joins all-rank barriers and exchanges counts with every rank, and Attention ranks hold dummy expert slots. afdEP-comm gives each rank its role: counts and tokens flow from Attention to FFN in dispatch and replies flow back in combine, only receivers wait, buffers are sized per role, each role launches only the warps it uses, and across NVLink domains a directional protocol runs when every domain holds one role.</desc>
<defs><marker id="a898781" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#898781" stroke-width="1.6"/></marker></defs>
<rect width="1120" height="530" fill="#1a1a19"/>
<text x="28" y="44" font-size="24" font-weight="700" fill="#f0efec" text-anchor="start">Same transport. Roles decide who sends, who receives and who waits.</text>
<rect x="28" y="70" width="520" height="392" rx="14" fill="#232322"/>
<rect x="28" y="70" width="6" height="392" rx="3" fill="#d95926"/>
<text x="54" y="108" font-size="22" font-weight="700" fill="#f0efec" text-anchor="start">FastAFD's DeepEP M2N (DeepEP V2)</text>
<rect x="54" y="132" width="190" height="128" rx="12" fill="#2c2c2a" stroke="#4a4a46"/>
<text x="149" y="162" font-size="17" font-weight="700" fill="#f0efec" text-anchor="middle">Attention GPUs</text>
<text x="149" y="188" font-size="13.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">send tokens</text>
<text x="149" y="210" font-size="13.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">hold dummy expert slots</text>
<text x="149" y="232" font-size="13.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">also receive and forward</text>
<rect x="332" y="132" width="190" height="128" rx="12" fill="#2c2c2a" stroke="#4a4a46"/>
<text x="427" y="162" font-size="17" font-weight="700" fill="#f0efec" text-anchor="middle">FFN GPUs</text>
<text x="427" y="188" font-size="13.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">hold the experts</text>
<text x="427" y="210" font-size="13.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">also run send warps</text>
<text x="427" y="232" font-size="13.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">with no tokens to send</text>
<path d="M252 186 L324 186" stroke="#898781" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#a898781)" marker-start="url(#a898781)"/>
<text x="288" y="177" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="middle">dispatch</text>
<path d="M324 230 L252 230" stroke="#898781" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#a898781)" marker-start="url(#a898781)"/>
<text x="288" y="221" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="middle">combine</text>
<circle cx="62" cy="295" r="4" fill="#d95926"/>
<text x="76" y="300" font-size="14.5" font-weight="400" fill="#f0efec" text-anchor="start">All-rank entry and exit barriers in both phases</text>
<circle cx="62" cy="329" r="4" fill="#d95926"/>
<text x="76" y="334" font-size="14.5" font-weight="400" fill="#f0efec" text-anchor="start">Counts exchanged with every rank, dummy slots included</text>
<circle cx="62" cy="363" r="4" fill="#d95926"/>
<text x="76" y="368" font-size="14.5" font-weight="400" fill="#f0efec" text-anchor="start">Every rank launches every warp class</text>
<circle cx="62" cy="397" r="4" fill="#d95926"/>
<text x="76" y="402" font-size="14.5" font-weight="400" fill="#f0efec" text-anchor="start">Across nodes, every domain sends, receives and waits</text>
<circle cx="62" cy="431" r="4" fill="#d95926"/>
<text x="76" y="436" font-size="14.5" font-weight="400" fill="#f0efec" text-anchor="start">Receive buffers sized for the whole world</text>
<rect x="572" y="70" width="520" height="392" rx="14" fill="#1d2633"/>
<rect x="572" y="70" width="6" height="392" rx="3" fill="#3987e5"/>
<text x="598" y="108" font-size="22" font-weight="700" fill="#f0efec" text-anchor="start">afdEP-comm</text>
<rect x="598" y="132" width="190" height="128" rx="12" fill="#2c2c2a" stroke="#4a4a46"/>
<text x="693" y="162" font-size="17" font-weight="700" fill="#f0efec" text-anchor="middle">Attention GPUs</text>
<text x="693" y="188" font-size="13.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">send tokens and counts</text>
<text x="693" y="210" font-size="13.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">collect replies</text>
<text x="693" y="232" font-size="13.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">never receive tokens</text>
<rect x="876" y="132" width="190" height="128" rx="12" fill="#2c2c2a" stroke="#4a4a46"/>
<text x="971" y="162" font-size="17" font-weight="700" fill="#f0efec" text-anchor="middle">FFN GPUs</text>
<text x="971" y="188" font-size="13.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">hold the experts</text>
<text x="971" y="210" font-size="13.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">receive and reply</text>
<text x="971" y="232" font-size="13.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">never originate tokens</text>
<path d="M796 186 L868 186" stroke="#898781" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#a898781)"/>
<text x="832" y="177" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="middle">dispatch</text>
<path d="M868 230 L796 230" stroke="#898781" stroke-width="2" fill="none" stroke-linecap="round" marker-end="url(#a898781)"/>
<text x="832" y="221" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="middle">combine</text>
<circle cx="606" cy="295" r="4" fill="#3987e5"/>
<text x="620" y="300" font-size="14.5" font-weight="400" fill="#f0efec" text-anchor="start">One NVLink domain: no entry barriers; only receivers wait</text>
<circle cx="606" cy="329" r="4" fill="#3987e5"/>
<text x="620" y="334" font-size="14.5" font-weight="400" fill="#f0efec" text-anchor="start">Counts flow Attention → FFN only</text>
<circle cx="606" cy="363" r="4" fill="#3987e5"/>
<text x="620" y="368" font-size="14.5" font-weight="400" fill="#f0efec" text-anchor="start">Each role launches only the warps it uses</text>
<circle cx="606" cy="397" r="4" fill="#3987e5"/>
<text x="620" y="402" font-size="14.5" font-weight="400" fill="#f0efec" text-anchor="start">Across nodes, a directional protocol (one role per domain)</text>
<circle cx="606" cy="431" r="4" fill="#3987e5"/>
<text x="620" y="436" font-size="14.5" font-weight="400" fill="#f0efec" text-anchor="start">One NVLink domain: receive buffers sized per role</text>
<text x="28" y="500" font-size="14" font-weight="400" fill="#c3c2b7" text-anchor="start">Both use DeepEP V2&#x27;s kernels over NVLink and NCCL GIN. Routing, quantization and expert compute stay with the caller.</text>
</svg>
